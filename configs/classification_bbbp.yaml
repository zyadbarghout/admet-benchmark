run_name: bbbp_substituted_phenyl_classification
task: classification
seed: 42
output_dir: ../outputs/classification_bbbp_substituted_phenyl

dataset:
  kind: csv
  path: ../data/classification/BBBP.csv
  target: p_np
  smiles_column: smiles
  name_column: name
  test_size: 0.2
  target_transform: none

chemical_filter:
  smarts: c1ccccc1
  substitution: substituted

features:
  radius: 2
  n_bits: 512
  include_rdkit_descriptors: true

hpo:
  cv_folds: 3
  n_iter: 3
  n_jobs: auto
  scoring: average_precision

models:
  - logistic_regression
  - extra_trees
  - random_forest
