run_name: bbbp_permeability
project_name: BBBP model arena
task: classification
seed: 42
output_dir: ../../outputs/current_benchmark/bbbp

dataset:
  kind: csv
  path: ../../data/classification/BBBP.csv
  target: p_np
  smiles_column: smiles
  name_column: name
  target_transform: none
  split:
    strategy: scaffold
    test_size: 0.2
    group_split_attempts: 256

features:
  representation: rdkit_descriptors
  descriptor_set: full

benchmark:
  mode: screening
  validation:
    strategy: scaffold
    size: 0.2
    group_split_attempts: 256
  selection_metric: pr_auc
  classical_hpo:
    cv_folds: 5
    n_iter: 8
    n_jobs: auto
    scoring: average_precision
  models:
    classical: [random_forest, extra_trees, xgboost, lightgbm]
    neural: [chemprop, chemeleon]
  neural:
    accelerator: auto
    inner_validation_size: 0.15
    inner_split:
      strategy: scaffold
      group_split_attempts: 256
    chemprop:
      candidates:
        - {epochs: 50, patience: 10, batch_size: 128, depth: 3, message_hidden_dim: 300, ffn_hidden_dim: 300, ffn_num_layers: 1, dropout: 0.05, max_lr: 0.001, init_lr: 0.0001, final_lr: 0.0001}
        - {epochs: 50, patience: 10, batch_size: 128, depth: 4, message_hidden_dim: 400, ffn_hidden_dim: 300, ffn_num_layers: 2, dropout: 0.10, max_lr: 0.0007, init_lr: 0.00007, final_lr: 0.00007}
    chemeleon:
      candidates:
        - {epochs: 25, patience: 5, batch_size: 128, ffn_hidden_dim: 300, ffn_num_layers: 1, dropout: 0.05, max_lr: 0.001, init_lr: 0.0001, final_lr: 0.0001}
        - {epochs: 25, patience: 5, batch_size: 128, ffn_hidden_dim: 400, ffn_num_layers: 2, dropout: 0.10, max_lr: 0.0007, init_lr: 0.00007, final_lr: 0.00007}
  evaluation:
    enabled: true
    decision_threshold: 0.5
    bootstrap_iterations: 1000
    bootstrap_metrics: [roc_auc, pr_auc, mcc]
    confidence_level: 0.95
