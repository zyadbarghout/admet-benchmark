run_name: openadmet_ksol
project_name: KSOL model arena
task: regression
seed: 42
output_dir: ../../outputs/current_benchmark/ksol

dataset:
  kind: openadmet
  cache_root: ${OPENADMET_DATASET_CACHE_ROOT}
  target: KSOL
  smiles_column: SMILES
  name_column: Molecule Name
  target_transform: challenge

features:
  # Classical models use the complete RDKit 2D descriptor panel. Morgan and
  # combined representations remain available through this one setting.
  representation: rdkit_descriptors
  descriptor_set: full

benchmark:
  mode: screening
  validation:
    strategy: scaffold
    size: 0.2
    group_split_attempts: 256
  selection_metric: mae
  classical_hpo:
    cv_folds: 5
    n_iter: 8
    n_jobs: auto
    scoring: neg_mean_absolute_error
  models:
    # Random Forest, XGBoost, and LightGBM are retained from the existing
    # OpenADMET analysis. Extra Trees is a deliberately strong tree baseline.
    classical: [random_forest, extra_trees, xgboost, lightgbm]
    neural: [chemprop, chemeleon]
  neural:
    accelerator: auto
    inner_validation_size: 0.15
    inner_split:
      strategy: scaffold
      group_split_attempts: 256
    chemprop:
      candidates:
        - {epochs: 50, patience: 10, batch_size: 128, depth: 3, message_hidden_dim: 300, ffn_hidden_dim: 300, ffn_num_layers: 1, dropout: 0.05, max_lr: 0.001, init_lr: 0.0001, final_lr: 0.0001}
        - {epochs: 50, patience: 10, batch_size: 128, depth: 4, message_hidden_dim: 400, ffn_hidden_dim: 300, ffn_num_layers: 2, dropout: 0.10, max_lr: 0.0007, init_lr: 0.00007, final_lr: 0.00007}
    chemeleon:
      candidates:
        - {epochs: 25, patience: 5, batch_size: 128, ffn_hidden_dim: 300, ffn_num_layers: 1, dropout: 0.05, max_lr: 0.001, init_lr: 0.0001, final_lr: 0.0001}
        - {epochs: 25, patience: 5, batch_size: 128, ffn_hidden_dim: 400, ffn_num_layers: 2, dropout: 0.10, max_lr: 0.0007, init_lr: 0.00007, final_lr: 0.00007}
  evaluation:
    enabled: true
    bootstrap_iterations: 1000
    bootstrap_metrics: [mae, relative_absolute_error, spearman_r, kendall_tau]
    confidence_level: 0.95
